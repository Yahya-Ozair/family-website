<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Zero to Brand — Start From ₹0</title>

  <meta name="description"
        content="Learn the fundamentals of building a real brand from zero. Join the free Zero to Brand community.">

  <meta name="theme-color" content="#050505">

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:#050505;
      color:#fff;

      line-height:1.5;

      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      max-width:100%;
    }

    button{
      font-family:inherit;
    }

    .container{
      width:min(92%,1080px);
      margin:auto;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    .ambient{
      position:fixed;
      pointer-events:none;
      z-index:-1;
      border-radius:50%;
      filter:blur(100px);
      opacity:.25;
    }

    .ambient.one{
      width:420px;
      height:420px;
      top:-180px;
      left:-160px;
      background:#ffffff;
    }

    .ambient.two{
      width:360px;
      height:360px;
      right:-180px;
      top:520px;
      background:#777;
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    nav{
      position:sticky;
      top:0;
      z-index:9999;

      background:rgba(5,5,5,.78);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      border-bottom:1px solid rgba(255,255,255,.07);
    }

    .nav-inner{
      height:68px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand{
      font-size:15px;
      font-weight:950;

      letter-spacing:-.5px;
    }

    .brand span{
      color:#777;
    }

    .nav-cta{
      display:flex;
      align-items:center;
      justify-content:center;

      padding:9px 15px;

      border-radius:9px;

      background:#fff;
      color:#050505;

      font-size:11px;
      font-weight:950;

      transition:.2s;
    }

    .nav-cta:hover{
      transform:translateY(-1px);
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero{
      position:relative;

      text-align:center;

      padding:82px 0 55px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;

      padding:8px 13px;

      border:1px solid rgba(255,255,255,.12);

      background:rgba(255,255,255,.035);

      border-radius:100px;

      color:#cfcfcf;

      font-size:10px;
      font-weight:850;

      letter-spacing:.7px;

      margin-bottom:25px;
    }

    .pulse{
      width:7px;
      height:7px;

      border-radius:50%;

      background:#38df7a;

      box-shadow:
        0 0 0 4px rgba(56,223,122,.08),
        0 0 16px rgba(56,223,122,.6);
    }

    .hero h1{
      max-width:940px;

      margin:auto;

      font-size:
        clamp(48px,10vw,92px);

      line-height:.9;

      letter-spacing:-6px;

      font-weight:950;
    }

    .hero h1 .muted{
      color:#555;
    }

    .hero h1 .shine{
      background:
        linear-gradient(
          110deg,
          #ffffff 0%,
          #bcbcbc 48%,
          #ffffff 100%
        );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero-description{
      max-width:620px;

      margin:27px auto 0;

      color:#8c8c8c;

      font-size:16px;
    }

    .hero-description strong{
      color:#dcdcdc;
    }


    /* =========================================================
       HERO CTA
    ========================================================= */

    .hero-actions{
      margin-top:29px;

      display:flex;

      align-items:center;
      justify-content:center;

      gap:10px;

      flex-wrap:wrap;
    }

    .primary-btn{
      display:inline-flex;

      align-items:center;
      justify-content:center;

      min-height:52px;

      padding:0 23px;

      border-radius:12px;

      background:#fff;
      color:#050505;

      font-size:13px;
      font-weight:950;

      box-shadow:
        0 15px 45px rgba(255,255,255,.08);

      transition:.2s;
    }

    .primary-btn:hover{
      transform:translateY(-3px);

      box-shadow:
        0 20px 55px rgba(255,255,255,.14);
    }

    .secondary-btn{
      display:inline-flex;

      align-items:center;
      justify-content:center;

      min-height:52px;

      padding:0 21px;

      border-radius:12px;

      background:rgba(255,255,255,.045);

      border:1px solid rgba(255,255,255,.1);

      color:#ddd;

      font-size:13px;
      font-weight:800;

      transition:.2s;
    }

    .secondary-btn:hover{
      background:rgba(255,255,255,.08);
    }

    .microcopy{
      margin-top:12px;

      color:#505050;

      font-size:10px;
    }


    /* =========================================================
       HERO IMAGE
    ========================================================= */

    .hero-visual{
      max-width:800px;

      margin:48px auto 0;

      padding:7px;

      border-radius:24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.18),
          rgba(255,255,255,.02)
        );

      box-shadow:
        0 35px 100px rgba(0,0,0,.55);
    }

    .hero-visual img{
      width:100%;

      height:400px;

      object-fit:cover;

      display:block;

      border-radius:18px;

      background:#111;
    }


    /* =========================================================
       TRUST STRIP
    ========================================================= */

    .trust-strip{
      display:flex;

      justify-content:center;
      align-items:center;

      flex-wrap:wrap;

      gap:8px;

      margin:27px auto 0;
    }

    .trust-item{
      padding:9px 12px;

      border:1px solid rgba(255,255,255,.07);

      border-radius:100px;

      background:rgba(255,255,255,.025);

      color:#777;

      font-size:10px;
      font-weight:750;
    }


    /* =========================================================
       SECTIONS
    ========================================================= */

    section{
      padding:82px 0;
    }

    .section-eyebrow{
      text-align:center;

      color:#666;

      font-size:10px;

      font-weight:900;

      letter-spacing:1.5px;

      margin-bottom:13px;
    }

    .section-title{
      text-align:center;

      max-width:750px;

      margin:auto;

      font-size:
        clamp(34px,7vw,58px);

      line-height:.96;

      letter-spacing:-3.5px;

      font-weight:950;
    }

    .section-subtitle{
      max-width:590px;

      margin:17px auto 42px;

      text-align:center;

      color:#777;

      font-size:14px;
    }


    /* =========================================================
       VALUE CARDS
    ========================================================= */

    .cards{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:12px;

      max-width:900px;

      margin:auto;
    }

    .card{
      position:relative;

      padding:24px;

      min-height:205px;

      border-radius:19px;

      border:1px solid rgba(255,255,255,.08);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      overflow:hidden;

      transition:.25s;
    }

    .card:hover{
      transform:translateY(-4px);

      border-color:
        rgba(255,255,255,.15);
    }

    .card-number{
      width:35px;
      height:35px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:#111;

      border:1px solid rgba(255,255,255,.08);

      color:#ddd;

      font-size:10px;

      font-weight:950;

      margin-bottom:28px;
    }

    .card h3{
      font-size:16px;

      margin-bottom:7px;

      font-weight:850;
    }

    .card p{
      color:#6f6f6f;

      font-size:12px;
    }


    /* =========================================================
       VALUE STACK
    ========================================================= */

    .value-box{
      max-width:820px;

      margin:45px auto 0;

      border-radius:22px;

      border:1px solid rgba(255,255,255,.09);

      background:#0a0a0a;

      overflow:hidden;
    }

    .value-header{
      display:flex;

      align-items:center;
      justify-content:space-between;

      padding:20px 22px;

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.06),
          transparent
        );

      border-bottom:
        1px solid rgba(255,255,255,.07);
    }

    .value-header strong{
      font-size:13px;
    }

    .value-header span{
      padding:6px 9px;

      border-radius:7px;

      background:rgba(56,223,122,.08);

      color:#5ee98f;

      font-size:9px;

      font-weight:900;
    }

    .value-row{
      display:flex;

      align-items:center;
      justify-content:space-between;

      gap:15px;

      padding:19px 22px;

      border-bottom:
        1px solid rgba(255,255,255,.055);
    }

    .value-row:last-child{
      border-bottom:0;
    }

    .value-content{
      display:flex;

      align-items:center;

      gap:13px;
    }

    .value-icon{
      width:35px;
      height:35px;

      min-width:35px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:#121212;

      color:#aaa;

      font-size:10px;

      font-weight:900;
    }

    .value-name{
      font-size:13px;
      font-weight:800;
    }

    .value-desc{
      margin-top:2px;

      color:#555;

      font-size:10px;
    }

    .free{
      color:#5ee98f;

      font-size:10px;

      font-weight:950;
    }


    /* =========================================================
       ROADMAP
    ========================================================= */

    .roadmap{
      max-width:780px;

      margin:42px auto 0;

      position:relative;
    }

    .roadmap::before{
      content:"";

      position:absolute;

      left:19px;

      top:25px;

      bottom:25px;

      width:1px;

      background:
        linear-gradient(
          #333,
          transparent
        );
    }

    .roadmap-item{
      position:relative;

      display:flex;

      gap:18px;

      padding-bottom:16px;
    }

    .roadmap-item:last-child{
      padding-bottom:0;
    }

    .roadmap-number{
      position:relative;
      z-index:2;

      width:39px;
      height:39px;

      min-width:39px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:11px;

      background:#111;

      border:1px solid rgba(255,255,255,.1);

      color:#ddd;

      font-size:10px;

      font-weight:950;
    }

    .roadmap-content{
      flex:1;

      padding:3px 0 20px;
    }

    .roadmap-content h3{
      font-size:15px;

      margin-bottom:4px;
    }

    .roadmap-content p{
      color:#666;

      font-size:12px;

      max-width:580px;
    }


    /* =========================================================
       PREMIUM CTA
    ========================================================= */

    .cta-section{
      padding-top:25px;
    }

    .cta-box{
      position:relative;

      overflow:hidden;

      text-align:center;

      padding:70px 25px;

      border-radius:29px;

      border:
        1px solid rgba(255,255,255,.12);

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(255,255,255,.12),
          transparent 55%
        ),
        #0a0a0a;

      box-shadow:
        0 35px 100px rgba(0,0,0,.4);
    }

    .cta-box::after{
      content:"";

      position:absolute;

      width:300px;
      height:300px;

      left:50%;
      bottom:-250px;

      transform:translateX(-50%);

      background:rgba(255,255,255,.06);

      filter:blur(70px);

      border-radius:50%;
    }

    .cta-label{
      display:inline-block;

      padding:7px 10px;

      border-radius:7px;

      background:rgba(255,255,255,.06);

      color:#aaa;

      font-size:9px;

      font-weight:900;

      letter-spacing:1px;

      margin-bottom:17px;
    }

    .cta-box h2{
      position:relative;
      z-index:2;

      max-width:700px;

      margin:auto;

      font-size:
        clamp(37px,8vw,66px);

      line-height:.93;

      letter-spacing:-4px;

      font-weight:950;
    }

    .cta-box p{
      position:relative;
      z-index:2;

      max-width:530px;

      margin:19px auto 27px;

      color:#777;

      font-size:14px;
    }

    .whatsapp-btn{
      position:relative;
      z-index:2;

      display:inline-flex;

      align-items:center;
      justify-content:center;

      min-height:52px;

      padding:0 24px;

      border-radius:12px;

      background:#25d366;

      color:#fff;

      font-size:13px;

      font-weight:950;

      box-shadow:
        0 15px 40px rgba(37,211,102,.1);

      transition:.2s;
    }

    .whatsapp-btn:hover{
      transform:translateY(-3px);

      box-shadow:
        0 20px 50px rgba(37,211,102,.16);
    }

    .cta-note{
      position:relative;
      z-index:2;

      margin-top:11px;

      color:#4d4d4d;

      font-size:10px;
    }


    /* =========================================================
       FAQ
    ========================================================= */

    .faq{
      max-width:760px;

      margin:42px auto 0;
    }

    details{
      border-bottom:
        1px solid rgba(255,255,255,.08);
    }

    details:first-child{
      border-top:
        1px solid rgba(255,255,255,.08);
    }

    summary{
      cursor:pointer;

      list-style:none;

      padding:20px 4px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:15px;

      font-size:14px;

      font-weight:800;
    }

    summary::-webkit-details-marker{
      display:none;
    }

    summary::after{
      content:"+";

      color:#666;

      font-size:20px;

      font-weight:300;
    }

    details[open] summary::after{
      content:"−";
    }

    details p{
      padding:0 30px 20px 4px;

      color:#666;

      font-size:12px;

      max-width:650px;
    }


    /* =========================================================
       FINAL CTA
    ========================================================= */

    .final{
      text-align:center;

      padding:85px 0 105px;
    }

    .final h2{
      max-width:720px;

      margin:auto;

      font-size:
        clamp(39px,8vw,68px);

      line-height:.93;

      letter-spacing:-4px;

      font-weight:950;
    }

    .final p{
      max-width:500px;

      margin:18px auto 26px;

      color:#707070;

      font-size:14px;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer{
      border-top:
        1px solid rgba(255,255,255,.07);

      padding:27px 0;

      text-align:center;

      color:#414141;

      font-size:10px;
    }


    /* =========================================================
       MOBILE STICKY CTA
    ========================================================= */

    .mobile-cta{
      display:none;
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media(max-width:800px){

      .cards{
        grid-template-columns:1fr 1fr;
      }

      .hero-visual img{
        height:330px;
      }
    }


    @media(max-width:600px){

      .container{
        width:min(92%,500px);
      }

      .nav-inner{
        height:62px;
      }

      .hero{
        padding:58px 0 42px;
      }

      .hero h1{
        letter-spacing:-3.5px;
      }

      .hero-description{
        font-size:14px;
      }

      .hero-actions{
        flex-direction:column;

        width:100%;
      }

      .primary-btn,
      .secondary-btn{
        width:100%;

        max-width:360px;
      }

      .hero-visual{
        margin-top:37px;
      }

      .hero-visual img{
        height:270px;
      }

      section{
        padding:62px 0;
      }

      .section-title{
        letter-spacing:-2.5px;
      }

      .cards{
        grid-template-columns:1fr;
      }

      .card{
        min-height:auto;
      }

      .value-row{
        padding:17px;
      }

      .value-desc{
        max-width:210px;
      }

      .roadmap::before{
        left:18px;
      }

      .cta-box{
        padding:53px 20px;
        border-radius:23px;
      }

      .cta-box h2{
        letter-spacing:-3px;
      }

      .whatsapp-btn{
        width:100%;
        max-width:350px;
      }

      .final{
        padding:65px 0 100px;
      }

      /* Sticky mobile CTA */

      .mobile-cta{
        display:flex;

        position:fixed;

        left:0;
        right:0;
        bottom:0;

        z-index:99999;

        padding:9px 12px;

        background:
          rgba(5,5,5,.92);

        backdrop-filter:blur(15px);

        border-top:
          1px solid rgba(255,255,255,.1);
      }

      .mobile-cta a{
        width:100%;

        min-height:48px;

        display:flex;

        align-items:center;
        justify-content:center;

        border-radius:11px;

        background:#25d366;

        color:#fff;

        font-size:12px;

        font-weight:950;
      }

      footer{
        padding-bottom:82px;
      }
    }


    @media(max-width:390px){

      .hero h1{
        font-size:44px;
      }

      .hero-visual img{
        height:230px;
      }

      .value-name{
        font-size:12px;
      }

      .value-desc{
        font-size:9px;
      }
    }

  </style>
</head>


<body>


<!-- =========================================================
     AMBIENT BACKGROUND
========================================================= -->

<div class="ambient one"></div>
<div class="ambient two"></div>


<!-- =========================================================
     NAVIGATION
========================================================= -->

<nav>

  <div class="container nav-inner">

    <a href="#" class="brand">
      ZERO <span>TO</span> BRAND
    </a>

    <a
      href="https://chat.whatsapp.com/CNI0zjmUxKF12rdCoTSSfH"
      target="_blank"
      rel="noopener"
      class="nav-cta"
    >
      JOIN FREE →
    </a>

  </div>

</nav>



<!-- =========================================================
     HERO
========================================================= -->

<main>

<section class="hero">

  <div class="container">

    <div class="eyebrow">
      <span class="pulse"></span>
      FREE COMMUNITY • START FROM ZERO
    </div>


    <h1>

      You don't need
      <span class="muted">millions.</span>

      <br>

      You need a
      <span class="shine">starting point.</span>

    </h1>


    <p class="hero-description">

      <strong>Zero to Brand</strong> is a free community
      for people who want to understand how a real brand
      is built — from the first idea to launch and growth.

    </p>


    <div class="hero-actions">

      <a
        href="https://chat.whatsapp.com/CNI0zjmUxKF12rdCoTSSfH"
        target="_blank"
        rel="
