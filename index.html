<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zero to Brand — Learn to Build a Brand</title>

  <meta
    name="description"
    content="Learn the fundamentals of building a brand from zero — product research, branding, ads, launch strategy and marketing. Join Zero to Brand for free."
  >

  <meta name="theme-color" content="#070707">

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #070707;
      color: #f7f4ed;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button {
      font: inherit;
    }


    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {
      --bg: #070707;
      --surface: #0d0d0c;
      --surface-2: #11100e;

      --gold: #d7b66c;
      --gold-light: #f0d99b;
      --gold-dark: #9e7938;

      --text: #f7f4ed;
      --muted: #96918a;
      --muted-dark: #5f5b55;

      --border: rgba(215, 182, 108, 0.17);
      --white-border: rgba(255, 255, 255, 0.075);
    }


    /* =====================================================
       BACKGROUND
    ===================================================== */

    body::before {
      content: "";
      position: fixed;
      width: 650px;
      height: 650px;
      top: -350px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(
        circle,
        rgba(215, 182, 108, 0.12),
        transparent 68%
      );
      pointer-events: none;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      right: -280px;
      top: 42%;
      background: radial-gradient(
        circle,
        rgba(215, 182, 108, 0.055),
        transparent 70%
      );
      pointer-events: none;
      z-index: -2;
    }


    /* =====================================================
       GLOBAL
    ===================================================== */

    .container {
      width: min(92%, 1080px);
      margin: auto;
    }

    .gold {
      color: var(--gold-light);
    }

    .gradient-gold {
      background:
        linear-gradient(
          110deg,
          #a77c31,
          #f4dda0,
          #c09342
        );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }


    /* =====================================================
       NAV
    ===================================================== */

    .nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(7, 7, 7, 0.84);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,0.055);
    }

    .nav-inner {
      height: 66px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 1.4px;
    }

    .brand-name span {
      color: var(--gold);
    }

    .nav-button {
      padding: 9px 15px;

      border-radius: 9px;

      border:
        1px solid rgba(215,182,108,0.28);

      background:
        rgba(215,182,108,0.06);

      color: var(--gold-light);

      font-size: 10px;
      font-weight: 900;
      letter-spacing: .6px;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      text-align: center;
      padding: 72px 0 72px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 13px;

      border-radius: 100px;

      border:
        1px solid var(--border);

      background:
        rgba(215,182,108,0.045);

      color: var(--gold-light);

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 1.3px;

      margin-bottom: 25px;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--gold-light);

      box-shadow:
        0 0 12px rgba(240,217,155,.8);
    }

    .hero h1 {
      max-width: 940px;
      margin: auto;

      font-size:
        clamp(48px, 9vw, 91px);

      line-height: .91;

      letter-spacing: -5px;

      font-weight: 950;
    }

    .hero-copy {
      max-width: 650px;

      margin: 25px auto 0;

      color: var(--muted);

      font-size: 15px;
    }

    .hero-copy strong {
      color: #ddd7cd;
    }


    /* =====================================================
       HERO VALUE STRIP
    ===================================================== */

    .value-strip {
      width: fit-content;
      max-width: 100%;

      margin: 28px auto 0;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      flex-wrap: wrap;

      padding: 11px 17px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(215,182,108,.1),
          rgba(215,182,108,.025)
        );

      border:
        1px solid rgba(215,182,108,.18);
    }

    .value-strip .old {
      color: #66615a;
      font-size: 12px;
      text-decoration: line-through;
    }

    .value-strip .arrow {
      color: #55514b;
    }

    .value-strip .free {
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 950;
    }


    /* =====================================================
       CTA
    ===================================================== */

    .hero-buttons {
      margin-top: 27px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .primary {
      min-height: 54px;

      padding: 0 26px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #f1db9c,
          #c3994b
        );

      color: #17130c;

      font-size: 12px;
      font-weight: 950;

      box-shadow:
        0 18px 50px rgba(215,182,108,.12);

      transition: .2s ease;
    }

    .primary:hover {
      transform: translateY(-3px);

      box-shadow:
        0 23px 60px rgba(215,182,108,.2);
    }

    .secondary {
      min-height: 54px;

      padding: 0 24px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,.1);

      background:
        rgba(255,255,255,.025);

      color: #c9c3ba;

      font-size: 12px;
      font-weight: 800;
    }

    .micro-note {
      margin-top: 10px;

      color: #504c46;

      font-size: 9px;
    }


    /* =====================================================
       HERO IMAGE
    ===================================================== */

    .hero-visual {
      max-width: 850px;

      margin: 44px auto 0;

      padding: 6px;

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          rgba(215,182,108,.32),
          rgba(255,255,255,.035),
          rgba(215,182,108,.12)
        );

      box-shadow:
        0 40px 100px rgba(0,0,0,.58);
    }

    .hero-visual img {
      width: 100%;
      height: 420px;

      object-fit: cover;

      border-radius: 19px;

      background: #111;
    }


    /* =====================================================
       SECTIONS
    ===================================================== */

    section {
      padding: 86px 0;
    }

    .section-label {
      text-align: center;

      color: var(--gold);

      font-size: 9px;
      font-weight: 950;

      letter-spacing: 2px;

      margin-bottom: 13px;
    }

    .section-title {
      max-width: 800px;

      margin: auto;

      text-align: center;

      font-size:
        clamp(37px, 7vw, 62px);

      line-height: .95;

      letter-spacing: -3.5px;

      font-weight: 950;
    }

    .section-description {
      max-width: 610px;

      margin: 18px auto 0;

      text-align: center;

      color: #716c65;

      font-size: 13px;
    }


    /* =====================================================
       VALUE SECTION
    ===================================================== */

    .value-card {
      max-width: 900px;

      margin: 43px auto 0;

      border-radius: 25px;

      border:
        1px solid rgba(215,182,108,.18);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(215,182,108,.11),
          transparent 55%
        ),
        #0c0c0b;

      overflow: hidden;

      box-shadow:
        0 30px 100px rgba(0,0,0,.38);
    }

    .value-top {
      text-align: center;

      padding: 42px 20px 35px;
    }

    .value-caption {
      color: #77716a;

      font-size: 10px;
      font-weight: 850;

      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .big-value {
      margin-top: 5px;

      font-size:
        clamp(62px, 13vw, 105px);

      line-height: .9;

      letter-spacing: -6px;

      font-weight: 950;
    }

    .value-explanation {
      margin-top: 10px;

      color: #625d56;

      font-size: 11px;
    }

    .free-badge {
      display: inline-flex;

      margin-top: 18px;

      padding: 8px 14px;

      border-radius: 100px;

      background:
        rgba(215,182,108,.08);

      border:
        1px solid rgba(215,182,108,.2);

      color: var(--gold-light);

      font-size: 10px;
      font-weight: 950;

      letter-spacing: .7px;
    }


    /* =====================================================
       VALUE ITEMS
    ===================================================== */

    .value-items {
      border-top:
        1px solid rgba(255,255,255,.06);
    }

    .value-item {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 19px 23px;

      border-bottom:
        1px solid rgba(255,255,255,.055);
    }

    .value-item:last-child {
      border-bottom: none;
    }

    .value-item-left {
      display: flex;

      align-items: center;

      gap: 13px;
    }

    .item-number {
      width: 38px;
      height: 38px;

      min-width: 38px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: #14120f;

      border:
        1px solid rgba(215,182,108,.13);

      color: var(--gold-light);

      font-size: 9px;
      font-weight: 950;
    }

    .item-title {
      color: #eee9e0;

      font-size: 12px;
      font-weight: 850;
    }

    .item-desc {
      margin-top: 2px;

      color: #625e57;

      font-size: 9px;
    }

    .item-price {
      color: #aaa39a;

      white-space: nowrap;

      font-size: 12px;
      font-weight: 900;
    }


    /* =====================================================
       TOTAL
    ===================================================== */

    .value-total {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 23px;

      background:
        linear-gradient(
          90deg,
          rgba(215,182,108,.1),
          rgba(215,182,108,.025)
        );

      border-top:
        1px solid rgba(215,182,108,.12);
    }

    .total-label {
      color: #d8d0c4;

      font-size: 11px;
      font-weight: 900;
    }

    .total-right {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .total-old {
      color: #5e5952;

      font-size: 11px;

      text-decoration: line-through;
    }

    .total-free {
      color: var(--gold-light);

      font-size: 20px;
      font-weight: 950;
    }


    /* =====================================================
       VALUE CTA
    ===================================================== */

    .center-cta {
      text-align: center;

      margin-top: 23px;
    }

    .center-cta p {
      margin-top: 9px;

      color: #514d47;

      font-size: 9px;
    }


    /* =====================================================
       LEARNING SECTION
    ===================================================== */

    .learning-grid {
      max-width: 950px;

      margin: 43px auto 0;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;
    }

    .learning-card {
      min-height: 185px;

      padding: 24px;

      border-radius: 18px;

      border:
        1px solid rgba(255,255,255,.07);

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.04),
          rgba(255,255,255,.012)
        );

      transition: .2s ease;
    }

    .learning-card:hover {
      transform: translateY(-4px);

      border-color:
        rgba(215,182,108,.2);
    }

    .learning-number {
      width: 34px;
      height: 34px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background: #14120f;

      color: var(--gold-light);

      border:
        1px solid rgba(215,182,108,.12);

      font-size: 9px;
      font-weight: 950;

      margin-bottom: 25px;
    }

    .learning-card h3 {
      font-size: 14px;

      margin-bottom: 7px;
    }

    .learning-card p {
      color: #66615a;

      font-size: 10px;
    }


    /* =====================================================
       ROADMAP
    ===================================================== */

    .roadmap {
      max-width: 820px;

      margin: 44px auto 0;

      position: relative;
    }

    .roadmap::before {
      content: "";

      position: absolute;

      left: 20px;

      top: 20px;
      bottom: 25px;

      width: 1px;

      background:
        linear-gradient(
          var(--gold-dark),
          transparent
        );

      opacity: .45;
    }

    .roadmap-item {
      position: relative;

      display: flex;

      gap: 18px;

      padding-bottom: 17px;
    }

    .roadmap-number {
      position: relative;
      z-index: 2;

      width: 41px;
      height: 41px;

      min-width: 41px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: #0d0c0a;

      border:
        1px solid rgba(215,182,108,.22);

      color: var(--gold-light);

      font-size: 9px;
      font-weight: 950;
    }

    .roadmap-content {
      padding-top: 3px;

      padding-bottom: 17px;
    }

    .roadmap-content h3 {
      font-size: 14px;

      margin-bottom: 4px;
    }

    .roadmap-content p {
      max-width: 600px;

      color: #65605a;

      font-size: 11px;
    }


    /* =====================================================
       COMMUNITY
    ===================================================== */

    .community-grid {
      max-width: 850px;

      margin: 43px auto 0;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .community-card {
      padding: 27px;

      border-radius: 19px;

      border:
        1px solid rgba(255,255,255,.07);

      background: #0c0c0b;
    }

    .community-card.highlight {
      border-color:
        rgba(215,182,108,.18);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(215,182,108,.09),
          transparent 60%
        ),
        #0c0c0b;
    }

    .community-card h3 {
      font-size: 15px;

      margin-bottom: 8px;
    }

    .community-card p {
      color: #66615a;

      font-size: 11px;
    }


    /* =====================================================
       MAIN CTA PANEL
    ===================================================== */

    .cta-section {
      padding-top: 25px;
    }

    .cta-panel {
      max-width: 950px;

      margin: auto;

      position: relative;

      overflow: hidden;

      padding: 68px 24px;

      text-align: center;

      border-radius: 28px;

      border:
        1px solid rgba(215,182,108,.2);

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(215,182,108,.16),
          transparent 60%
        ),
        #0c0c0b;

      box-shadow:
        0 40px 120px rgba(0,0,0,.48);
    }

    .cta-label {
      position: relative;
      z-index: 2;

      display: inline-block;

      padding: 7px 11px;

      border-radius: 7px;

      background:
        rgba(215,182,108,.08);

      border:
        1px solid rgba(215,182,108,.15);

      color: var(--gold-light);

      font-size: 9px;
      font-weight: 950;

      letter-spacing: 1px;

      margin-bottom: 17px;
    }

    .cta-panel h2 {
      position: relative;
      z-index: 2;

      max-width: 760px;

      margin: auto;

      font-size:
        clamp(40px, 8vw, 72px);

      line-height: .91;

      letter-spacing: -4px;

      font-weight: 950;
    }

    .cta-panel p {
      position: relative;
      z-index: 2;

      max-width: 570px;

      margin: 18px auto 27px;

      color: #77716a;

      font-size: 13px;
    }

    .whatsapp {
      position: relative;
      z-index: 2;

      min-height: 55px;

      padding: 0 27px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      border-radius: 12px;

      background: #25d366;

      color: white;

      font-size: 12px;
      font-weight: 950;

      box-shadow:
        0 15px 45px rgba(37,211,102,.09);

      transition: .2s ease;
    }

    .whatsapp:hover {
      transform: translateY(-3px);

      box-shadow:
        0 20px 55px rgba(37,211,102,.16);
    }

    .cta-small {
      position: relative;
      z-index: 2;

      margin-top: 10px;

      color: #4d4943;

      font-size: 9px;
    }


    /* =====================================================
       FAQ
    ===================================================== */

    .faq {
      max-width: 800px;

      margin: 40px auto 0;
    }

    details {
      border-top:
        1px solid rgba(255,255,255,.07);
    }

    details:last-child {
      border-bottom:
        1px solid rgba(255,255,255,.07);
    }

    summary {
      list-style: none;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 20px 3px;

      color: #ddd7ce;

      font-size: 12px;
      font-weight: 850;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";

      color: var(--gold);

      font-size: 18px;

      font-weight: 400;
    }

    details[open] summary::after {
      content: "−";
    }

    details p {
      padding:
        0 30px 20px 3px;

      max-width: 680px;

      color: #66615a;

      font-size: 10px;
    }


    /* =====================================================
       FINAL
    ===================================================== */

    .final {
      text-align: center;

      padding:
        72px 0
        110px;
    }

    .final h2 {
      max-width: 780px;

      margin: auto;

      font-size:
        clamp(40px, 8vw, 70px);

      line-height: .92;

      letter-spacing: -4px;

      font-weight: 950;
    }

    .final p {
      max-width: 520px;

      margin: 17px auto 26px;

      color: #69645d;

      font-size: 12px;
    }


    /* =====================================================
       FOOTER
    ==============================
