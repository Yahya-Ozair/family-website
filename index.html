<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zero to Brand — ₹20,000 Value. FREE.</title>

<meta name="description"
content="Learn the fundamentals of building a brand from zero. Product research, branding, ads, launch strategy and more — completely free.">

<meta name="theme-color" content="#070605">

<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:#070605;
  color:#f7f3eb;

  line-height:1.5;

  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
}

img{
  max-width:100%;
  display:block;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{
  --bg:#070605;
  --card:#0e0d0b;
  --card2:#12100d;

  --gold:#d6b56a;
  --gold-light:#f0d898;
  --gold-dark:#9d7a37;

  --white:#f7f3eb;
  --muted:#96918a;
  --muted2:#625f59;

  --border:rgba(214,181,106,.16);
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
  content:"";

  position:fixed;

  width:600px;
  height:600px;

  top:-300px;
  left:50%;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle,
      rgba(214,181,106,.13),
      transparent 68%
    );

  filter:blur(20px);

  pointer-events:none;

  z-index:-2;
}

body::after{
  content:"";

  position:fixed;

  width:400px;
  height:400px;

  right:-250px;
  top:45%;

  background:
    radial-gradient(
      circle,
      rgba(214,181,106,.06),
      transparent 70%
    );

  pointer-events:none;

  z-index:-2;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
  width:min(92%,1080px);
  margin:auto;
}


/* =========================================================
   NAV
========================================================= */

nav{
  position:sticky;
  top:0;
  z-index:9999;

  background:rgba(7,6,5,.82);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav-inner{
  height:68px;

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:15px;

  font-weight:950;

  letter-spacing:1.4px;
}

.logo span{
  color:var(--gold);
}

.nav-join{
  display:flex;

  align-items:center;
  justify-content:center;

  padding:10px 16px;

  border-radius:8px;

  border:1px solid rgba(214,181,106,.3);

  background:
    linear-gradient(
      135deg,
      rgba(214,181,106,.16),
      rgba(214,181,106,.04)
    );

  color:var(--gold-light);

  font-size:10px;

  font-weight:950;

  letter-spacing:.5px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  text-align:center;

  padding:82px 0 70px;

  position:relative;
}

.top-badge{
  display:inline-flex;

  align-items:center;
  gap:8px;

  padding:8px 14px;

  border-radius:100px;

  border:1px solid var(--border);

  background:
    rgba(214,181,106,.055);

  color:var(--gold-light);

  font-size:10px;

  font-weight:900;

  letter-spacing:1px;

  margin-bottom:27px;

  box-shadow:
    0 0 30px rgba(214,181,106,.04);
}

.badge-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--gold-light);

  box-shadow:
    0 0 12px rgba(240,216,152,.8);
}

.hero h1{
  max-width:950px;

  margin:auto;

  font-size:
    clamp(48px,9.5vw,92px);

  line-height:.91;

  letter-spacing:-5px;

  font-weight:950;
}

.hero h1 .gold{
  background:
    linear-gradient(
      110deg,
      #b88d3d,
      #f3dc9b,
      #c39a4b
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero-subtitle{
  max-width:650px;

  margin:27px auto 0;

  color:var(--muted);

  font-size:16px;
}

.hero-subtitle strong{
  color:#ddd5c6;
}


/* =========================================================
   HERO CTA
========================================================= */

.hero-cta{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:11px;

  flex-wrap:wrap;

  margin-top:30px;
}

.main-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:54px;

  padding:0 25px;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #f0d898,
      #c39a4b
    );

  color:#17130b;

  font-size:12px;

  font-weight:950;

  letter-spacing:.2px;

  box-shadow:
    0 15px 45px rgba(214,181,106,.12);

  transition:.22s;
}

.main-btn:hover{
  transform:translateY(-3px);

  box-shadow:
    0 20px 55px rgba(214,181,106,.2);
}

.outline-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:54px;

  padding:0 23px;

  border-radius:12px;

  border:1px solid rgba(255,255,255,.1);

  background:rgba(255,255,255,.025);

  color:#c8c2b8;

  font-size:12px;

  font-weight:800;

  transition:.2s;
}

.outline-btn:hover{
  background:rgba(255,255,255,.055);
}

.hero-note{
  margin-top:11px;

  color:#55514b;

  font-size:10px;
}


/* =========================================================
   HERO IMAGE
========================================================= */

.hero-image{
  max-width:820px;

  margin:50px auto 0;

  padding:7px;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      rgba(214,181,106,.35),
      rgba(255,255,255,.04),
      rgba(214,181,106,.12)
    );

  box-shadow:
    0 35px 100px rgba(0,0,0,.65);
}

.hero-image img{
  width:100%;

  height:410px;

  object-fit:cover;

  border-radius:18px;

  background:#111;
}


/* =========================================================
   SECTION
========================================================= */

section{
  padding:88px 0;
}

.section-label{
  text-align:center;

  color:var(--gold);

  font-size:10px;

  font-weight:950;

  letter-spacing:2px;

  margin-bottom:14px;
}

.section-title{
  max-width:800px;

  margin:auto;

  text-align:center;

  font-size:
    clamp(36px,7vw,61px);

  line-height:.95;

  letter-spacing:-3.5px;

  font-weight:950;
}

.section-title .gold{
  color:var(--gold-light);
}

.section-description{
  max-width:610px;

  margin:18px auto 0;

  text-align:center;

  color:#77716a;

  font-size:14px;
}


/* =========================================================
   VALUE HERO
========================================================= */

.value-intro{
  max-width:900px;

  margin:45px auto 0;

  padding:45px 25px;

  text-align:center;

  border-radius:25px;

  border:1px solid var(--border);

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(214,181,106,.1),
      transparent 58%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  box-shadow:
    0 30px 100px rgba(0,0,0,.35);
}

.value-small{
  color:#777;

  font-size:11px;

  font-weight:800;

  letter-spacing:1.2px;

  text-transform:uppercase;
}

.value-price{
  margin-top:8px;

  font-size:
    clamp(60px,13vw,105px);

  line-height:.9;

  letter-spacing:-6px;

  font-weight:950;

  background:
    linear-gradient(
      110deg,
      #a97f32,
      #f3d994,
      #b88a39
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.value-cross{
  margin-top:11px;

  color:#67615a;

  font-size:13px;
}

.value-cross span{
  text-decoration:line-through;

  text-decoration-color:
    rgba(214,181,106,.65);
}

.value-free{
  display:inline-flex;

  margin-top:20px;

  padding:9px 17px;

  border-radius:100px;

  background:
    rgba(214,181,106,.1);

  border:
    1px solid rgba(214,181,106,.23);

  color:#f1d99a;

  font-size:11px;

  font-weight:950;

  letter-spacing:1px;
}


/* =========================================================
   VALUE BREAKDOWN
========================================================= */

.value-list{
  max-width:900px;

  margin:15px auto 0;

  border-radius:22px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.08);

  background:#0c0b09;
}

.value-list-header{
  padding:20px 23px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  border-bottom:1px solid rgba(255,255,255,.07);

  background:
    linear-gradient(
      90deg,
      rgba(214,181,106,.09),
      transparent
    );
}

.value-list-header strong{
  font-size:12px;

  letter-spacing:.7px;
}

.value-list-header span{
  color:var(--gold);

  font-size:10px;

  font-weight:950;
}

.value-row{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  padding:21px 23px;

  border-bottom:
    1px solid rgba(255,255,255,.055);

  transition:.2s;
}

.value-row:last-child{
  border-bottom:0;
}

.value-row:hover{
  background:
    rgba(214,181,106,.025);
}

.value-left{
  display:flex;

  align-items:center;

  gap:14px;
}

.value-icon{
  width:40px;
  height:40px;

  min-width:40px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:#14120f;

  border:
    1px solid rgba(214,181,106,.13);

  color:var(--gold-light);

  font-size:10px;

  font-weight:950;
}

.value-name{
  font-size:13px;

  font-weight:850;

  color:#eee8de;
}

.value-description{
  margin-top:3px;

  color:#625e57;

  font-size:10px;
}

.value-amount{
  color:#aaa39a;

  font-size:13px;

  font-weight:850;

  white-space:nowrap;
}

.value-total{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:25px 23px;

  background:
    linear-gradient(
      90deg,
      rgba(214,181,106,.11),
      rgba(214,181,106,.025)
    );
}

.total-label{
  font-size:12px;

  font-weight:900;
}

.total-price{
  display:flex;

  align-items:center;

  gap:11px;
}

.total-old{
  color:#5f5a53;

  font-size:12px;

  text-decoration:line-through;
}

.total-free{
  color:#f1d99a;

  font-size:20px;

  font-weight:950;
}


/* =========================================================
   OFFER CTA
========================================================= */

.offer-cta{
  text-align:center;

  margin-top:24px;
}

.offer-cta p{
  color:#625d55;

  font-size:10px;

  margin-top:10px;
}


/* =========================================================
   WHAT YOU GET
========================================================= */

.features{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;

  max-width:930px;

  margin:45px auto 0;
}

.feature{
  padding:25px;

  min-height:190px;

  border-radius:19px;

  border:1px solid rgba(255,255,255,.075);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.015)
    );

  transition:.22s;
}

.feature:hover{
  transform:translateY(-4px);

  border-color:
    rgba(214,181,106,.2);
}

.feature-number{
  width:35px;
  height:35px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:#15120e;

  border:
    1px solid rgba(214,181,106,.12);

  color:var(--gold-light);

  font-size:9px;

  font-weight:950;

  margin-bottom:28px;
}

.feature h3{
  font-size:15px;

  margin-bottom:7px;
}

.feature p{
  color:#69645d;

  font-size:11px;
}


/* =========================================================
   ROADMAP
========================================================= */

.roadmap{
  max-width:820px;

  margin:45px auto 0;

  position:relative;
}

.roadmap::before{
  content:"";

  position:absolute;

  top:25px;
  bottom:25px;

  left:20px;

  width:1px;

  background:
    linear-gradient(
      var(--gold-dark),
      transparent
    );

  opacity:.45;
}

.roadmap-item{
  position:relative;

  display:flex;

  gap:18px;

  padding-bottom:17px;
}

.roadmap-number{
  position:relative;

  z-index:2;

  width:41px;
  height:41px;

  min-width:41px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:#0d0c0a;

  border:
    1px solid rgba(214,181,106,.22);

  color:var(--gold-light);

  font-size:10px;

  font-weight:950;
}

.roadmap-content{
  padding-top:3px;

  padding-bottom:18px;
}

.roadmap-content h3{
  font-size:15px;

  margin-bottom:4px;
}

.roadmap-content p{
  color:#66615a;

  font-size:12px;

  max-width:600px;
}


/* =========================================================
   WHY COMMUNITY
========================================================= */

.community-box{
  max-width:850px;

  margin:45px auto 0;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.community-card{
  padding:29px;

  border-radius:20px;

  border:1px solid rgba(255,255,255,.075);

  background:#0c0b09;
}

.community-card h3{
  font-size:16px;

  margin-bottom:9px;
}

.community-card p{
  color:#68635c;

  font-size:12px;
}

.community-card.gold-card{
  border-color:
    rgba(214,181,106,.18);

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(214,181,106,.1),
      transparent 60%
    ),
    #0c0b09;
}


/* =========================================================
   BIG CTA
========================================================= */

.big-cta{
  padding:20px 0 90px;
}

.cta-panel{
  position:relative;

  overflow:hidden;

  max-width:950px;

  margin:auto;

  text-align:center;

  padding:70px 25px;

  border-radius:29px;

  border:
    1px solid rgba(214,181,106,.2);

  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(214,181,106,.16),
      transparent 58%
    ),
    #0c0b09;

  box-shadow:
    0 40px 120px rgba(0,0,0,.5);
}

.cta-panel::before{
  content:"";

  position:absolute;

  width:450px;
  height:450px;

  left:50%;
  bottom:-400px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    rgba(214,181,106,.08);

  filter:blur(70px);
}

.cta-label{
  position:relative;
  z-index:2;

  display:inline-block;

  padding:7px 11px;

  border-radius:7px;

  background:
    rgba(214,181,106,.09);

  border:
    1px solid rgba(214,181,106,.15);

  color:var(--gold-light);

  font-size:9px;

  font-weight:950;

  letter-spacing:1.2px;

  margin-bottom:18px;
}

.cta-panel h2{
  position:relative;
  z-index:2;

  max-width:760px;

  margin:auto;

  font-size:
    clamp(39px,8vw,70px);

  line-height:.92;

  letter-spacing:-4px;

  font-weight:950;
}

.cta-panel h2 span{
  color:var(--gold-light);
}

.cta-panel p{
  position:relative;
  z-index:2;

  max-width:550px;

  margin:19px auto 28px;

  color:#77716a;

  font-size:14px;
}

.whatsapp-btn{
  position:relative;
  z-index:2;

  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  min-height:55px;

  padding:0 27px;

  border-radius:12px;

  background:#25d366;

  color:#fff;

  font-size:12px;

  font-weight:950;

  box-shadow:
    0 15px 45px rgba(37,211,102,.1);

  transition:.2s;
}

.whatsapp-btn:hover{
  transform:translateY(-3px);

  box-shadow:
    0 20px 55px rgba(37,211,102,.17);
}

.cta-under{
  position:relative;
  z-index:2;

  margin-top:11px;

  color:#4e4a44;

  font-size:10px;
}


/* =========================================================
   FAQ
========================================================= */

.faq{
  max-width:800px;

  margin:43px auto 0;
}

details{
  border-top:
    1px solid rgba(255,255,255,.07);
}

details:last-child{
  border-bottom:
    1px solid rgba(255,255,255,.07);
}

summary{
  list-style:none;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  padding:21px 3px;

  color:#ddd6cc;

  font-size:13px;

  font-weight:800;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"+";

  color:var(--gold);

  font-size:19px;

  font-weight:400;
}

details[open] summary::after{
  content:"−";
}

details p{
  max-width:680px;

  padding:0 30px 21px 3px;

  color:#66615a;

  font-size:11px;
}


/* =========================================================
   FINAL
========================================================= */

.final{
  text-align:center;

  padding:80px 0 105px;
}

.final h2{
  max-width:750px;

  margin:auto;

  font-size:
    clamp(40px,8vw,70px);

  line-height:.92;

  letter-spacing:-4px;

  font-weight:950;
}

.final h2 span{
  color:var(--gold-light);
}

.final p{
  margin:18px auto 27px;

  color:#6b665e;

  font-size:13px;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  padding:27px 0;

  border-top:
    1px solid rgba(255,255,255,.06);

  text-align:center;

  color:#403d38;

  font-size:10px;
}


/* =========================================================
   MOBILE STICKY CTA
========================================================= */

.mobile-cta{
  display:none;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

  .features{
    grid-template-columns:1fr 1fr;
  }

  .community-box{
    grid-template-columns:1fr;
  }

  .hero-image img{
    height:340px;
  }
}


@media(max-width:600px){

  .container{
    width:min(92%,520px);
  }

  .nav-inner{
    height:62px;
  }

  .logo{
    font-size:12px;
  }

  .nav-join{
    padding:9px 12px;

    font-size:9px;
  }

  .hero{
    padding:59px 0 52px;
  }

  .hero h1{
    letter-spacing:-3.5px;
  }

  .hero-subtitle{
    font-size:14px;
  }

  .hero-cta{
    flex-direction:column;
  }

  .main-btn,
  .outline-btn{
    width:100%;

    max-width:360px;
  }

  .hero-image{
    margin-top:37px;
  }

  .hero-image img{
    height:265px;
  }

  section{
    padding:65px 0;
  }

  .section-title{
    letter-spacing:-2.5px;
  }

  .value-intro{
    margin-top:34px;

    padding:37px 17px;
  }

  .value-price{
    letter-spacing:-4px;
  }

  .value-row{
    padding:18px;
  }

  .value-left{
    gap:10px;
  }

  .value-icon{
    width:35px;
    height:35px;

    min-width:35px;
  }

  .value-name{
    font-size:12px;
  }

  .value-description{
    font-size:9px;

    max-width:200px;
  }

  .value-amount{
    font-size:11px;
  }

  .value-total{
    padding:22px 18px;
  }

  .total-free{
    font-size:18px;
  }

  .features{
    grid-template-columns:1fr;
  }

  .feature{
    min-height:auto;
  }

  .roadmap::before{
    left:19px;
  }

  .cta-panel{
    padding:53px 19px;

    border-radius:23px;
  }

  .cta-panel h2{
    letter-spacing:-3px;
  }

  .whatsapp-btn{
    width:100%;

    max-width:360px;
  }

  .final{
    padding:65px 0 100px;
  }

  /* Sticky CTA */

  .mobile-cta{
    display:block;

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:99999;

    padding:9px 11px;

    background:
      rgba(7,6,5,.94);

    backdrop-filter:blur(18px);

    border-top:
      1px solid rgba(214,181,106,.12);
  }

  .mobile-cta a{
    width:100%;

    min-height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;
